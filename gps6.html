<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OSM GPS – Navigation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: #181818;
    padding: 0.4rem 0.5rem;
    border-bottom: 1px solid #333;
    display: flex;
    gap: 0.4rem;
    align-items: center;
    z-index: 1000;
    flex-shrink: 0;
  }
  header input {
    flex: 1;
    min-width: 0;
    padding: 0.45rem 0.6rem;
    background: #000;
    border: 1px solid #444;
    border-radius: 6px;
    color: #eee;
    font-size: 1rem;
  }
  header button {
    padding: 0.45rem 0.7rem;
    background: #222;
    border: 1px solid #555;
    border-radius: 6px;
    color: #eee;
    cursor: pointer;
    font-size: 1rem;
    flex-shrink: 0;
  }

  /* Slide-down menu */
  #menu {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 3.0rem);
    left: 0;
    right: 0;
    z-index: 950;
    background: #181818;
    border-bottom: 1px solid #333;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    align-items: center;
    padding: 0.4rem 0.5rem;
    transform: translateY(-150%);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: transform .25s ease, opacity .25s ease, visibility .25s;
  }
  #menu.open {
    transform: translateY(0);
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  #menu button {
    padding: 0.45rem 0.7rem;
    background: #222;
    border: 1px solid #555;
    border-radius: 6px;
    color: #eee;
    cursor: pointer;
    font-size: 1rem;
    flex-shrink: 0;
  }
  #menu button:active { background: #333; }

  #map {
    flex: 1;
    width: 100%;
    background: #0f0f0f;
  }

  /* GPS status chip */
  #status {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 3.2rem + var(--menu-h, 0px));
    left: 0.6rem;
    background: rgba(0,0,0,0.75);
    border: 1px solid #333;
    border-radius: 999px;
    padding: 0.25rem 0.7rem;
    font-size: 0.8rem;
    z-index: 1400;
    max-width: 70vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
    transition: top .25s ease;
  }

  /* Destination chip */
  #dest-chip {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 4.6rem + var(--menu-h, 0px));
    left: 0.6rem;
    right: 0.6rem;
    background: rgba(0,0,0,0.8);
    border: 1px solid #3fb6ff;
    border-radius: 999px;
    padding: 0.35rem 0.8rem;
    font-size: 0.85rem;
    display: none;
    align-items: center;
    gap: 0.5rem;
    z-index: 1400;
    transition: top .25s ease;
  }
  #dest-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dest-chip button {
    background: none;
    border: none;
    color: #bbb;
    font-size: 1.15rem;
    cursor: pointer;
    padding: 0.25rem 0.45rem;
    border-radius: 50%;
  }
  #dest-chip button:active { color: #fff; background: #333; }

  /* Right-side control buttons */
  #controls {
    position: fixed;
    right: 0.6rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    z-index: 1500;
  }
  #controls button {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(0,0,0,0.78);
    border: 1px solid #555;
    color: #eee;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
    padding: 0;
  }
  #controls button small { font-size: 0.58rem; opacity: 0.85; }
  #controls button.on { border-color: #5ce1ff; color: #5ce1ff; }
  #controls button:active { background: #333; }

  /* Speedometer */
  #speed {
    position: absolute;
    right: 1rem;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
    z-index: 3;
    background: rgba(0,0,0,0.7);
    border: 1px solid #444;
    border-radius: 12px;
    padding: 0.35rem 0.65rem;
    color: #fff;
    text-align: center;
    line-height: 1;
    pointer-events: none;
    min-width: 3.2rem;
  }
  #speed-val {
    font-size: 1.5rem;
    font-weight: 800;
    color: #ffcc00;
  }
  #speed-unit {
    display: block;
    font-size: 0.55rem;
    font-weight: 600;
    opacity: 0.8;
    margin-top: 0.12rem;
  }

  /* Bottom-left written turn instruction */
  #rv-turn {
    position: absolute;
    left: 1rem;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: rgba(0,0,0,0.7);
    border: 2px solid #ffcc00;
    border-radius: 14px;
    padding: 0.45rem 0.85rem;
    max-width: 68%;
    pointer-events: none;
  }
  #rv-turn.warn {
    animation: rvPulse 0.6s infinite alternate;
  }
  #rv-turn-icon {
    flex-shrink: 0;
    width: 2.6rem;
    height: 2.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #rv-turn-icon svg {
    width: 2.2rem;
    height: 2.2rem;
    display: block;
  }
  #rv-turn-text {
    font-size: 1.15rem;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 4px #000;
    line-height: 1.1;
  }
  #rv-turn-dist {
    font-size: 0.85rem;
    font-weight: 700;
    color: #ffcc00;
    margin-top: 0.05rem;
  }

  /* Search results */
  #search-results {
    position: fixed;
    top: 3.0rem;
    left: 0.6rem;
    right: 0.6rem;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    display: none;
    max-height: 42vh;
    overflow-y: auto;
    z-index: 1600;
  }
  #search-results div {
    padding: 0.5rem 0.7rem;
    border-bottom: 1px solid #222;
    cursor: pointer;
    font-size: 0.9rem;
  }
  #search-results div small { color: #999; display: block; font-size: 0.75rem; }
  #search-results div:last-child { border-bottom: none; }
  #search-results div:hover { background: #222; }

  /* POI category bar */
  #poi-bar {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 3.4rem + var(--menu-h, 0px));
    left: 0.6rem;
    right: 0.6rem;
    display: none;
    gap: 0.4rem;
    overflow-x: auto;
    padding-bottom: 0.2rem;
    z-index: 1500;
    -webkit-overflow-scrolling: touch;
  }
  #poi-bar.on { display: flex; }
  #poi-bar button {
    flex-shrink: 0;
    background: rgba(0,0,0,0.78);
    border: 1px solid #444;
    color: #eee;
    border-radius: 999px;
    padding: 0.35rem 0.75rem;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #poi-bar button:active { background: #333; }

  /* User arrow marker */
  .user-wrap { background: none !important; border: none !important; }
  .user-head {
    display: block;
    width: 0;
    height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 18px solid #3388ff;
    transform-origin: center;
    transition: transform .3s linear;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
  }

  /* Heading indicator in header */
  #heading-chip {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: #000;
    border: 1px solid #444;
    border-radius: 999px;
    padding: 0.3rem 0.55rem;
    font-size: 0.85rem;
    color: #ccc;
    flex-shrink: 0;
  }
  #heading-arrow {
    display: inline-block;
    font-size: 0.95rem;
    transition: transform .3s linear;
  }

  /* Full-screen 3D navigation view (main view while navigating) */
  #road-view {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    z-index: 2500;
  }
  #road-view.on { display: block; }
  #road-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #rv-btns {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 0.6rem);
    left: 0.6rem;
    right: 0.6rem;
    display: flex;
    justify-content: space-between;
    z-index: 3;
  }
  #rv-btns button {
    background: rgba(0,0,0,0.7);
    border: 1px solid #444;
    color: #eee;
    border-radius: 999px;
    padding: 0.45rem 0.9rem;
    font-size: 0.9rem;
    cursor: pointer;
    z-index: 3;
  }
  #rv-top {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 3.4rem);
    left: 1rem;
    max-width: 60%;
    text-align: left;
    pointer-events: none;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }
  #rv-arrow {
    flex-shrink: 0;
    width: 4.4rem;
    height: 4.4rem;
    border-radius: 50%;
    background: rgba(0,0,0,0.75);
    border: 2px solid #ffcc00;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 10px #000;
  }
  #rv-arrow svg {
    width: 2.6rem;
    height: 2.6rem;
    display: block;
  }
  #rv-arrow.warn {
    animation: rvPulse 0.6s infinite alternate;
  }
  @keyframes rvPulse {
    from { border-color: #ffcc00; }
    to   { border-color: #fff; box-shadow: 0 0 18px #ffcc00; }
  }
  #rv-dist {
    font-size: 2.5rem;
    font-weight: 800;
    color: #ffcc00;
    text-shadow: 0 2px 8px #000;
    line-height: 1.05;
  }
  #rv-text {
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 5px #000;
    margin-top: 0.15rem;
  }
  #rv-sub {
    font-size: 0.9rem;
    color: #cfe3ff;
    text-shadow: 0 1px 3px #000;
    margin-top: 0.1rem;
  }
  #rv-eta {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 3.4rem);
    right: 1rem;
    max-width: 34%;
    text-align: right;
    background: rgba(0,0,0,0.55);
    border: 1px solid #444;
    border-radius: 10px;
    padding: 0.4rem 0.75rem;
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    z-index: 2;
    pointer-events: none;
  }

  /* Bottom navigation bar */
  #nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.94);
    border-top: 1px solid #333;
    padding: 0.7rem 1rem;
    display: none;
    flex-direction: column;
    gap: 0.3rem;
    z-index: 3000;
  }
  #nav-main {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1.05rem;
    font-weight: 600;
  }
  #nav-main #nav-text { flex: 1; }
  #navStop {
    background: #222;
    border: 1px solid #555;
    border-radius: 50%;
    color: #ff6b6b;
    font-size: 1rem;
    width: 38px;
    height: 38px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #nav-sub { font-size: 0.85rem; color: #bbb; }
  .nav-icon svg { width: 30px; height: 30px; stroke: #5ce1ff; stroke-width: 2.6; fill: none; }
  .nav-icon { flex-shrink: 0; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 6.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.88);
    padding: 0.45rem 0.8rem;
    border-radius: 999px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    z-index: 4000;
    font-size: 0.9rem;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show { opacity: 1; }
</style>

<body>

<header>
  <button id="menuBtn" title="Menu">☰</button>
  <input id="search" placeholder="Search city, street, place…" autocomplete="off">

</header>

<div id="menu">
  <button id="viewBtn" title="Toggle 3D nav view">🧭 3D</button>

<div id="poi-bar">
  <button data-tag="food">🍔 Food</button>
  <button data-tag="coffee">☕ Coffee</button>

  <button data-tag="pharmacy">💊 Pharmacy</button>
  <button data-tag="hospital">🏥 Hospital</button>
  <button data-tag="shop">🛒 Shops</button>

</div>

<div id="controls">
  <button id="locBtn">📍<br><small>Follow</small></button>
  <button id="routeBtn">🧭<br><small>Navigate</small></button>

<div id="road-view">

  </div>
  <div id="rv-top">
    <div id="rv-arrow"></div>

      <div id="rv-dist">…</div>
    </div>
  </div>
  <svg id="road-svg"></svg>

  <div id="nav-main">

    <span id="nav-text">Continue</span>

  </div>
  <div id="nav-sub"></div>
</div>

<div id="toast"></div>

<script>
/* ================= helpers ================= */
function toast(msg, ms=2200){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove("show"), ms);
}
function setStatus(html){
  const el=document.getElementById("status");
  el.innerHTML=html;
}
function formatDistance(m){
  return m<1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(1)} km`;
}
function formatETA(sec){
  const d=new Date(Date.now()+sec*1000);
  return d.toTimeString().slice(0,5);
}
function hav(a,b){
  const R=6371000;
  const φ1=a[0]*Math.PI/180, φ2=b[0]*Math.PI/180;
  const dφ=(b[0]-a[0])*Math.PI/180, dλ=(b[1]-a[1])*Math.PI/180;
  const s=Math.sin(dφ/2)**2+Math.cos(φ1)*Math.cos(φ2)*Math.sin(dλ/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function projOnSeg(p,a,b){
  const dx=b[0]-a[0], dy=b[1]-a[1];
  const L2=dx*dx+dy*dy||1e-9;
  let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2;
  t=Math.max(0,Math.min(1,t));
  return {t,d:Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy))};
}
function computeHeading(lat1,lon1,lat2,lon2){
  const φ1=lat1*Math.PI/180, φ2=lat2*Math.PI/180;
  const λ1=lon1*Math.PI/180, λ2=lon2*Math.PI/180;
  const y=Math.sin(λ2-λ1)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(λ2-λ1);
  const brng=Math.atan2(y,x)*180/Math.PI;
  return (brng+360)%360;
}

/* ================= map ================= */
const map=L.map("map").setView([40.85,14.30],13);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  keepBuffer: 8,
  updateWhenIdle: false,
  updateWhenZooming: true,
  updateInterval: 50
}).addTo(map);

let userMarker=null, userCircle=null;
const userIcon=L.divIcon({
  className:"user-wrap",
  html:'<span class="user-head"></span>',
  iconSize:[24,24],
  iconAnchor:[12,12]
});
function updateUser(lat,lon,acc){
  const ll=[lat,lon];
  if(!userMarker) userMarker=L.marker(ll,{icon:userIcon}).addTo(map);
  else userMarker.setLatLng(ll);
  if(!userCircle) userCircle=L.circle(ll,{radius:acc,color:"#3388ff",weight:1,fillOpacity:0.1}).addTo(map);
  else { userCircle.setLatLng(ll); userCircle.setRadius(acc); }
}
function rotateMarker(angle){
  if (!userMarker) return;
  const el=userMarker.getElement();
  const head=el && el.querySelector(".user-head");
  if (head) head.style.transform=`rotate(${angle}deg)`;
}
function updateHeadingChip(angle){
  const ar=document.getElementById("heading-arrow");
  const tx=document.getElementById("heading-text");
  if(ar) ar.style.transform=`rotate(${angle}deg)`;
  if(tx) tx.textContent=`${Math.round(angle)}°`;
}

/* ================= GPS (starts immediately) ================= */
let follow=true, watchId=null;
let lastPos=null, lastPosForHeading=null, lastHeading=0;
let lastSpeed=0, lastSpeedT=0;

function startGPS(){
  if(watchId!==null) return;
  if(!navigator.geolocation){ setStatus("No GPS"); toast("Device has no GPS"); return; }
  requestWakeLock();
  watchId=navigator.geolocation.watchPosition(handlePos, ()=>{
    setStatus("⚠ No GPS signal");
    toast("Waiting for GPS signal…");
  }, {enableHighAccuracy:true, maximumAge:5000});
}

function handlePos(pos){
  const {latitude,longitude,accuracy,heading,speed}=pos.coords;
  const prev=lastPosForHeading;
  lastPos={lat:latitude,lon:longitude,acc:accuracy};

  let kmh=(speed!=null && !Number.isNaN(speed)) ? speed*3.6 : 0;
  const now=Date.now();
  if(kmh<=0 && prev && lastSpeedT){
    const dt=(now-lastSpeedT)/1000;
    if(dt>0.5){
      const d=hav([prev.lat,prev.lon],[latitude,longitude])*1000;
      if(d>1 && d<150) kmh=(d/dt)*3.6;
    }
  }
  if(kmh>320) kmh=0;
  lastSpeed=lastSpeed*0.5+kmh*0.5;
  lastSpeedT=now;
  updateSpeed();

  let hd=heading;
  if(hd==null && prev) hd=computeHeading(prev.lat,prev.lon,latitude,longitude);
  if(hd!=null && !Number.isNaN(hd)) lastHeading=hd;
  lastPosForHeading={lat:latitude,lon:longitude};

  updateUser(latitude,longitude,accuracy);
  if(follow && !userInteracting){
    map.setView([latitude,longitude], map.getZoom());
  }
  rotateMarker(lastHeading);
  updateHeadingChip(lastHeading);
  if(routeActive) updateNavigation();
  setStatus(`📍 GPS ${formatDistance(accuracy)}`);
}
function updateSpeed(){
  const el=document.getElementById("speed-val");
  if(el) el.textContent=Math.round(lastSpeed);
}

let userInteracting=false;
map.on("dragstart zoomstart",()=>userInteracting=true);
map.on("dragend zoomend",()=>setTimeout(()=>userInteracting=false,1200));

startGPS();

const locBtn=document.getElementById("locBtn");
locBtn.onclick=()=>{
  follow=!follow;
  locBtn.classList.toggle("on", follow);
  if(follow && lastPos){
    map.setView([lastPos.lat,lastPos.lon], map.getZoom());
    toast("Following you");
  } else {
    toast("Free mode");
  }
};
locBtn.classList.add("on");

/* ================= slide-down menu ================= */
const menuEl=document.getElementById("menu");
const menuBtn=document.getElementById("menuBtn");
function updateMenuOffset(){
  document.documentElement.style.setProperty(
    "--menu-h",
    menuEl.classList.contains("open") ? menuEl.offsetHeight+"px" : "0px"
  );
}
function closeMenu(){
  menuEl.classList.remove("open");
  menuBtn.classList.remove("on");
  updateMenuOffset();
  closePoiBar();
}
menuBtn.onclick=()=>{
  menuEl.classList.toggle("open");
  menuBtn.classList.toggle("on");
  updateMenuOffset();
  closePoiBar();
};

/* ================= search ================= */
const searchInput=document.getElementById("search");
const resultsEl=document.getElementById("search-results");
let searchTimer=null;

searchInput.oninput=()=>{
  const q=searchInput.value.trim();
  clearTimeout(searchTimer);
  closeMenu();
  closePoiBar();
  if(!q){ resultsEl.style.display="none"; return; }
  searchTimer=setTimeout(()=>doSearch(q),500);
};
searchInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    clearTimeout(searchTimer);
    const q=searchInput.value.trim();
    if(q) doSearch(q);
  }
});
document.getElementById("clearBtn").onclick=()=>{
  searchInput.value="";
  resultsEl.style.display="none";
  searchInput.focus();
};

async function doSearch(q){
  try{
    const r=await fetch("https://photon.komoot.io/api/?q="+encodeURIComponent(q)+"&limit=12");
    const j=await r.json();
    let f=j.features||[];
    const loc=lastPos?[lastPos.lat,lastPos.lon]:null;
    if(loc){
      f=f.sort((a,b)=>{
        const da=hav([a.geometry.coordinates[1],a.geometry.coordinates[0]],loc);
        const db=hav([b.geometry.coordinates[1],b.geometry.coordinates[0]],loc);
        return da-db;
      });
    }
    resultsEl.innerHTML="";
    if(!f.length && loc){
      const pois=await fetchPOIsByName(q, loc[0], loc[1]);
      if(pois.length){
        showPOIResults(pois, loc[0], loc[1], `Results for “${q}”`);
        return;
      }
    }
    f.slice(0,8).forEach(x=>{
      const p=x.properties||{};
      const name=p.name||p.street||p.housenumber||"";
      const place=p.city||p.town||p.village||p.county||p.country||"";
      let dstr="";
      if(loc) dstr=formatDistance(hav([x.geometry.coordinates[1],x.geometry.coordinates[0]],loc));
      const div=document.createElement("div");
      const main=name?escapeHtml(name):escapeHtml(place);
      const sub=[place, dstr].filter(Boolean).join(" • ");
      div.innerHTML=`${main}<small>${escapeHtml(sub)}</small>`;
      div.onclick=()=>{
        const [lon,lat]=x.geometry.coordinates;
        setDestination(lat,lon, [name,place].filter(Boolean).join(", "));
        resultsEl.style.display="none";
        searchInput.blur();
      };
      resultsEl.appendChild(div);
    });
    resultsEl.style.display=f.length?"block":"none";
  }catch(e){ toast("Search error"); }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
document.addEventListener("click",e=>{
  if(!resultsEl.contains(e.target) && e.target!==searchInput)
    resultsEl.style.display="none";
});

function closePoiBar(){

async function overpassQuery(q){
  for(const ep of POI_ENDPOINTS){
    try{
      const r=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(q),signal:AbortSignal.timeout(20000)});
      if(!r.ok) continue;
      const j=await r.json();
      if(j.elements) return j.elements;
    }catch(e){}
  }
  return [];
}
function escReg(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

async function fetchPOIsByTag(tag,lat,lon){
  return overpassQuery(
    `[out:json][timeout:20];(node[${tag}](around:4000,${lat},${lon});`+
    `way[${tag}](around:4000,${lat},${lon});relation[${tag}](around:4000,${lat},${lon}););out center 25;`
  );
}
async function fetchPOIsByName(name,lat,lon){
  const esc=escReg(name);
  return overpassQuery(
    `[out:json][timeout:20];(node["name"~"${esc}",i](around:5000,${lat},${lon});`+
    `way["name"~"${esc}",i](around:5000,${lat},${lon});`+
    `node["name:en"~"${esc}",i](around:5000,${lat},${lon});`+
    `way["name:en"~"${esc}",i](around:5000,${lat},${lon}););out center 20;`
  );
}

function showPOIResults(elements,lat,lon,title){
  resultsEl.innerHTML="";
  const rows=[];
  for(const e of elements){
    const plat=e.lat!=null?e.lat:(e.center?e.center.lat:null);
    const plon=e.lon!=null?e.lon:(e.center?e.center.lon:null);
    if(plat==null||plon==null) continue;
    const t=e.tags||{};
    const name=t.name||t["name:en"]||"Unnamed";
    const kind=t.amenity||t.shop||t.tourism||t.leisure||t.highway||"POI";
    rows.push({plat,plon,name,kind,d:hav([plat,plon],[lat,lon])});
  }
  rows.sort((a,b)=>a.d-b.d);
  const head=document.createElement("div");
  head.style.fontWeight="bold";
  head.innerHTML=escapeHtml(title);
  resultsEl.appendChild(head);
  if(!rows.length){
    const div=document.createElement("div");
    div.innerHTML="No POIs found nearby";
    resultsEl.appendChild(div);
  } else {
    rows.slice(0,20).forEach(x=>{
      const div=document.createElement("div");
      div.innerHTML=`${escapeHtml(x.name)}<small>${escapeHtml(x.kind)} • ${formatDistance(x.d)}</small>`;
      div.onclick=()=>{
        setDestination(x.plat,x.plon,x.name);
        resultsEl.style.display="none";
        closePoiBar();
      };
      resultsEl.appendChild(div);
    });
  }
  resultsEl.style.display="block";
}

Array.from(poiBar.querySelectorAll("button")).forEach(b=>{

});

/* ================= Valhalla fallback (when OSRM is offline) ================= */
function decodePolyline6(str){
  const coords=[]; let index=0, lat=0, lon=0, byte, shift, result, i;
  while(index<str.length){
    for(i=0;i<2;i++){
      shift=0; result=0;
      do{
        byte=str.charCodeAt(index++)-63;
        result |= (byte&0x1f)<<shift;
        shift+=5;
      }while(byte>=0x20);
      const delta=(result&1)? ~(result>>1) : (result>>1);
      if(i===0) lat+=delta; else lon+=delta;
    }
    coords.push({lat:lat/1e6, lon:lon/1e6});
  }
  return coords;
}
function valhallaStepType(vt){
  if(vt===1) return "depart";
  if(vt===4||vt===5||vt===6) return "arrive";
  if(vt===26||vt===27) return "roundabout";
  if(vt===9) return "slight-right";
  if(vt===10||vt===11) return "turn-right";
  if(vt===14||vt===15) return "turn-left";
  if(vt===16) return "slight-left";
  return "continue";
}
function toOsrmStep(m, shape){
  const p=shape[m.begin_shape_index]||{lat:0,lon:0};
  const ba=Number.isFinite(m.bearing_after)?m.bearing_after:null;
  const bb=Number.isFinite(m.bearing_before)?m.bearing_before:null;
  const bearings=(bb!=null&&ba!=null)?[(bb+180)%360, ba]:(ba!=null?[ba]:[0]);
  return {
    name: (m.street_names&&m.street_names.length)?m.street_names.join(", "):"",
    distance: Math.max(0,(m.length||0)*1000),
    duration: Math.max(0,m.time||0),
    maneuver:{
      type: valhallaStepType(m.type),
      instruction: m.instruction||"Continue",
      location:[p.lon,p.lat],
      bearing_before: bb,
      bearing_after: ba
    },
    intersections:[{bearings, entry:bearings.map(()=>true)}]
  };
}
function normalizeValhalla(j){
  const leg=j.trip.legs[0];
  const shape=decodePolyline6(leg.shape);
  const steps=leg.maneuvers.map(m=>toOsrmStep(m, shape));
  return {routes:[{
    distance: (leg.summary.length||0)*1000,
    duration: leg.summary.time||0,
    geometry:{coordinates: shape.map(p=>[p.lon,p.lat])},
    legs:[{steps}]
  }]};
}
async function fetchValhallaRoute(u,d){
  const body={
    locations:[{lat:u.lat,lon:u.lon},{lat:d.lat,lon:d.lon}],
    costing: transportMode==="foot"?"pedestrian":"auto",
    costing_options: transportMode==="foot"
      ? { pedestrian:{ ignore_oneways:true } }
      : { auto:{ use_highways:0.95 } },
    directions_options:{units:"kilometers", language:"en-US"}
  };
  for(const ep of ["https://valhalla1.openstreetmap.de/route","https://valhalla2.openstreetmap.de/route"]){
    try{
      const r=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:AbortSignal.timeout(25000)});
      if(!r.ok) continue;
      const x=await r.json();
      if(x.trip && x.trip.status===0 && x.trip.legs && x.trip.legs.length) return normalizeValhalla(x);
    }catch(e){}
  }
  return null;
}

async function startRoute(refit=true, silentBoot=false){
  if(!lastPos){ toast("Waiting for GPS fix…"); return; }
  if(!dest){ toast("Set a destination first"); return; }
  requestWakeLock();
  const mySeq=++routeSeq;

  const u=lastPos, d=dest;
  if(hav([u.lat,u.lon],[d.lat,d.lon])<25){
    toast("You're already at the destination");
    setStatus("📍 GPS ready");
    return;
  }

  setStatus(`⛳ Routing to ${dest.label}…`);
  let j=null, lastErr="";
  for(const base of getRouters()){
    try{
      const url=`${base}${u.lon},${u.lat};${d.lon},${d.lat}?overview=full&steps=true&geometries=geojson&alternatives=true`;
      const r=await fetch(url,{signal:AbortSignal.timeout(20000)});
      if(!r.ok){ lastErr=`server ${r.status}`; continue; }
      const x=await r.json();
      if(x.routes && x.routes.length){ j=x; break; }
      lastErr=x.message||"no route";
    }catch(e){ lastErr="network"; }
  }
  if(mySeq!==routeSeq) return;
  if(!j || !j.routes || !j.routes.length){
    j=await fetchValhallaRoute(u,d);
    if(j) lastErr="osrm offline — valhalla";
  }
  if(mySeq!==routeSeq) return;
  if(!j || !j.routes || !j.routes.length){
    toast(`No route found (${lastErr}). Try a nearby road or street.`);
    setStatus("📍 GPS ready");
    return;
  }

    const routes=j.routes;
    let route=routes[0];
    if(routePref==="short"){
      for(const r of routes) if(r.distance<route.distance) route=r;
    } else if(routePref==="fast"){
      for(const r of routes) if(r.duration<route.duration) route=r;
    }
    routeSteps=route.legs[0].steps;
    routeCoords=route.geometry.coordinates.map(c=>[c[1],c[0]]);
    routeDuration=route.duration;
    maneuverS=null;
    arrived=false;
    remainDistArrived=false;

    if(routeLine) routeLine.remove();
    routeLine=L.featureGroup([
      L.polyline(routeCoords,{color:"#000",weight:8,opacity:0.8}),
      L.polyline(routeCoords,{color:"#2f6fd0",weight:5,opacity:0.95})
    ]).addTo(map);
    if(activeSegLine) activeSegLine.remove();
    activeSegLine=L.polyline([],{color:"#5ce1ff",weight:7}).addTo(map);
    if(refit) map.fitBounds(routeLine.getBounds(),{padding:[40,40]});

    routeActive=true;
    navView=true;
    if(!silentBoot) ttsBoot=true;
    applyNavView();
    const prefIcon=(PREF_META[routePref]||PREF_META.best)[0];
    setStatus(`${prefIcon} ${dest.label} • ${formatDistance(route.distance)} • ${Math.round(route.duration/60)} min`);
    requestAnimationFrame(()=>updateNavigation());
}

function stopRoute(){
  routeSeq++;
  rerouting=false;
  routeActive=false; arrived=false; remainDistArrived=false;
  cancelSpeech();
  ttsState={idx:-1, spoken:Infinity};
  if(routeLine){ routeLine.remove(); routeLine=null; }
  if(activeSegLine){ activeSegLine.remove(); activeSegLine=null; }
  navView=false;
  applyNavView();
  hideNavBar();
  if(lastPos && follow) map.setView([lastPos.lat,lastPos.lon], map.getZoom());
}

function svgIcon(type){

    case "slight-right": return `<svg viewBox="0 0 24 24"><path d="M4 4 L12 10 L6 18"/></svg>`;
    case "roundabout": return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>`;
    case "arrive": return `<svg viewBox="0 0 24 24"><path d="M20 6 L9 17 L4 12"/></svg>`;
    default: return `<svg viewBox="0 0 24 24"><path d="M12 18 L12 4 M8 8 L12 4 L16 8"/></svg>`;
  }
}

function bigArrow(type){
  const fill="none", sw=6;
  const P=d=>`<path d="${d}" fill="${fill}" stroke="#ffcc00" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  switch(type){
    case "turn-right": return `<svg viewBox="0 0 48 48">${P("M24 5 L24 26 L40 26")}${P("M31 18 L40 26 L31 34")}</svg>`;
    case "turn-left": return `<svg viewBox="0 0 48 48">${P("M24 5 L24 26 L8 26")}${P("M17 18 L8 26 L17 34")}</svg>`;
    case "slight-right": return `<svg viewBox="0 0 48 48">${P("M20 5 L25 26 L40 30")}${P("M31 25 L40 30 L33 39")}</svg>`;
    case "slight-left": return `<svg viewBox="0 0 48 48">${P("M28 5 L23 26 L8 30")}${P("M17 25 L8 30 L15 39")}</svg>`;
    case "uturn": return `<svg viewBox="0 0 48 48">${P("M32 5 L32 18 A12 12 0 1 0 8 18 L8 34")}${P("M32 11 L39 5 L46 11")}</svg>`;
    case "roundabout": return `<svg viewBox="0 0 48 48"><circle cx="24" cy="26" r="10" fill="none" stroke="#ffcc00" stroke-width="5"/>${P("M24 12 L24 18")}${P("M20 15 L24 12 L28 15")}</svg>`;
    case "arrive": return `<svg viewBox="0 0 48 48">${P("M6 24 L18 36 L42 12")}</svg>`;
    default: return `<svg viewBox="0 0 48 48">${P("M24 5 L24 43")}${P("M15 17 L24 5 L33 17")}</svg>`;
  }
}

try{ ttsMode=localStorage.getItem("gps_tts_mode")||"system"; }catch(e){}
const ttsBtn=document.getElementById("ttsBtn");

  system:["🔊","System voice"],
  online:["📡","Online voice"],
  off:["🔇","Voice off"]
};

};
updateTtsBtn();

let ttsAudio=null, speakToken=0;
function speakOnline(text){
  try{
    if(ttsAudio){ ttsAudio.pause(); ttsAudio.currentTime=0; }
    const a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q="+encodeURIComponent(text));
    ttsAudio=a;
    a.onerror=()=>{ if(a===ttsAudio) ttsAudio=null; };
    a.play().catch(()=>{});
  }catch(e){}
}
function switchToOnline(){
  if(ttsMode!=="off" && ttsMode!=="online"){
    ttsMode="online";
    try{ localStorage.setItem("gps_tts_mode","online"); }catch(e){}
    updateTtsBtn();
    toast("System TTS unavailable — switched to online voice");
  }
}
function speak(text){
  if(ttsMode==="off" || !text) return;
  if(ttsMode==="online"){ speakOnline(text); return; }
  if(typeof speechSynthesis==="undefined"){ switchToOnline(); speakOnline(text); return; }
  try{
    const tok=++speakToken;
    let started=false, done=false;
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US";
    u.rate=1.05;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(x=>/^en[-_]/i.test(x.lang));
    if(v) u.voice=v;
    const fail=()=>{
      if(done || tok!==speakToken) return;
      done=true;
      switchToOnline();
      speakOnline(text);
    };
    u.onstart=()=>{ started=true; };
    u.onend=()=>{ done=true; };
    u.onerror=()=>fail();
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    setTimeout(()=>{ if(!started) fail(); }, 2500);
  }catch(e){ switchToOnline(); speakOnline(text); }
}
function cancelSpeech(){
  speakToken++;
  try{ if(typeof speechSynthesis!=="undefined") speechSynthesis.cancel(); }catch(e){}
  try{ if(ttsAudio){ ttsAudio.pause(); ttsAudio.currentTime=0; } }catch(e){}
}

function ttsThreshold(kmh){
  const v=Math.max(0, Number.isFinite(kmh)?kmh:0);
  return Math.max(300, Math.min(1000, 14*v-400));
}
let ttsState={idx:-1, spoken:Infinity};
let ttsBoot=false;
function checkTTS(next, distToTurn, step, kmh){
  if(ttsMode==="off" || !step) return;
  if(ttsBoot){
    ttsBoot=false;
    ttsState={idx:next, spoken:2000};
    speak(step.maneuver.instruction||step.name||"Continue");
    return;
  }
  if(next!==ttsState.idx){ ttsState={idx:next, spoken:Infinity}; }
  const thr=ttsThreshold(kmh);
  const inst=step.maneuver.instruction||step.name||"Continue";
  if(distToTurn<=thr && thr<ttsState.spoken){
    ttsState.spoken=thr;
    speak(`In ${formatDistance(distToTurn)}, ${inst}`);
  } else if(distToTurn<=30 && 30<ttsState.spoken){
    ttsState.spoken=30;
    speak(inst);
  }
}

/* ================= navigation updates ================= */
function projectOnRoute(lat,lon){
  const cum=[0];
  for(let i=1;i<routeCoords.length;i++) cum[i]=cum[i-1]+hav(routeCoords[i-1],routeCoords[i]);
  let best=1e18, bi=0, bt=0;
  for(let i=0;i<routeCoords.length-1;i++){
    const r=projOnSeg([lat,lon],routeCoords[i],routeCoords[i+1]);
    if(r.d<best){ best=r.d; bi=i; bt=r.t; }
  }
  const s=cum[bi]+bt*(cum[bi+1]-cum[bi]);
  return {s, i:bi, t:bt, off:best, total:cum[cum.length-1], cum};
}
function projRouteIndex(lat,lon){
  let best=1e18, bi=0, bt=0;
  for(let i=0;i<routeCoords.length-1;i++){
    const r=projOnSeg([lat,lon],routeCoords[i],routeCoords[i+1]);
    if(r.d<best){ best=r.d; bi=i; bt=r.t; }
  }
  return {i:bi, t:bt};
}
function sliceRoute(proj, toS){
  const out=[];
  const a=routeCoords[proj.i], b=routeCoords[proj.i+1];
  const t0=Math.max(0,Math.min(1,proj.t));
  out.push([a[0]+(b[0]-a[0])*t0, a[1]+(b[1]-a[1])*t0]);
  for(let j=proj.i+1;j<routeCoords.length && proj.cum[j]<toS;j++) out.push(routeCoords[j]);
  let k=proj.i;
  while(k<routeCoords.length-1 && proj.cum[k+1]<toS) k++;
  const c=routeCoords[k], dd=routeCoords[k+1];
  const seg=proj.cum[k+1]-proj.cum[k];
  const tk=seg? (toS-proj.cum[k])/seg : 0;
  out.push([c[0]+(dd[0]-c[0])*tk, c[1]+(dd[1]-c[1])*tk]);
  return out;
}

function pointAlongRoute(cum, s){
  const rc=routeCoords;
  if(s<=0) return [rc[0][0], rc[0][1]];
  for(let i=0;i<cum.length-1;i++){
    if(s<=cum[i+1]){
      const seg=cum[i+1]-cum[i];
      const t=seg? (s-cum[i])/seg : 0;
      const a=rc[i], b=rc[i+1];
      return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
    }
  }
  return [rc[rc.length-1][0], rc[rc.length-1][1]];
}

function renderRoadPreview(proj, userS, distToTurn, totalDist, nextIdx){
  const step=routeSteps[nextIdx];
  if(!step || remainDistArrived || !navView){ return; }
  const instr=step.maneuver.instruction || step.name || "Continue";
  rvTurnText.textContent=instr;
  rvTurnDist.textContent=distToTurn>0 ? `in ${formatDistance(distToTurn)}` : "now";
  rvTurnIcon.innerHTML=bigArrow(step.maneuver.type);
  rvTurnIcon.parentElement.classList.toggle("warn", distToTurn<100);
  rvDist.textContent=formatDistance(distToTurn);
  rvArrow.innerHTML=bigArrow(step.maneuver.type);
  rvArrow.classList.toggle("warn", distToTurn<100);

  const W=roadSvg.clientWidth||360, H=roadSvg.clientHeight||640;
  roadSvg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const horizonY=H*0.33, groundH=H-horizonY;
  const K=groundH*3.0, fov=W*1.05;
  const projP=(along, lat)=>{
    const d=Math.max(2.5, along);
    return {x:W/2+fov*lat/d, y:horizonY+K/d, s:K/d};
  };

  const previewDepth=Math.min(300, Math.max(120, distToTurn+90));
  const toS=Math.min(userS+previewDepth, totalDist);
  const cum=proj.cum;
  const samples=[];
  for(let s=Math.max(0,userS); s<=toS; s+=4) samples.push(pointAlongRoute(cum,s));

  const lat0=samples[0][0], lon0=samples[0][1];
  const cosLat=Math.cos(lat0*Math.PI/180);
  const toEn=p=>[(p[1]-lon0)*cosLat*111320, (p[0]-lat0)*110540];
  const e0=toEn([lat0,lon0]);
  let fx=samples[1]? (toEn(samples[1])[0]-e0[0]) : 1;
  let fy=samples[1]? (toEn(samples[1])[1]-e0[1]) : 0;
  const fl=Math.hypot(fx,fy)||1; fx/=fl; fy/=fl;
  const toAlong=p=>{ const e=toEn(p); const dx=e[0]-e0[0], dy=e[1]-e0[1]; return {a:dx*fx+dy*fy, l:dx*fy-dy*fx}; };
  const fwdBearing=(Math.atan2(fx,fy)*180/Math.PI+360)%360;

  const roadW=8;
  const Larr=[], Rarr=[], Lh=[], Rh=[];
  let cl="";
  samples.forEach((p,i)=>{
    const {a,l}=toAlong(p);
    const P=projP(a,l);
    const hw=fov*(roadW/2)/Math.max(2.5,a);
    const hhi=fov*(roadW/2*0.62)/Math.max(2.5,a);
    Larr.push(`${(P.x-hw).toFixed(1)},${P.y.toFixed(1)}`);
    Rarr.push(`${(P.x+hw).toFixed(1)},${P.y.toFixed(1)}`);
    Lh.push(`${(P.x-hhi).toFixed(1)},${P.y.toFixed(1)}`);
    Rh.push(`${(P.x+hhi).toFixed(1)},${P.y.toFixed(1)}`);
    cl+=(i?"L":"M")+P.x.toFixed(1)+" "+P.y.toFixed(1);
  });
  const roadPts=[...Larr, ...Rarr.reverse()].join(" ");
  const hiPts=[...Lh, ...Rh.reverse()].join(" ");

  const m=step.maneuver.location; // [lon,lat]
  const mE=toEn([m[1],m[0]]);
  const mdx=mE[0]-e0[0], mdy=mE[1]-e0[1];
  const malong=Math.max(2.5, mdx*fx+mdy*fy), mlat=mdx*fy-mdy*fx;
  const ba=step.maneuver.bearing_after;

  let branches="";
  const branchPts=(bearing, lenM, wM, color, opacity, taper)=>{
    const rad=bearing*Math.PI/180;
    const dx=Math.sin(rad), dy=Math.cos(rad);
    const px=-dy, py=dx;
    const L=Math.min(lenM, previewDepth*0.4+30);
    const Ls=[], Rs=[];
    const N=6;
    for(let i=0;i<=N;i++){
      const t=i/N;
      const w=taper? wM*(1-0.72*t) : wM;
      const hw=w/2;
      const cx=mE[0]+dx*L*t, cy=mE[1]+dy*L*t;
      const Lp=toAlong([lat0+(cy)/110540, lon0+(cx)/(cosLat*111320)]);
      const pa=projP(Lp.a, Lp.l+hw), pb=projP(Lp.a, Lp.l-hw);
      Ls.push(`${pa.x.toFixed(1)},${pa.y.toFixed(1)}`);
      Rs.push(`${pb.x.toFixed(1)},${pb.y.toFixed(1)}`);
    }
    const poly=[...Ls, ...Rs.reverse()].join(" ");
    return `<polygon points="${poly}" fill="${color}" opacity="${opacity}"/>`;
  };
  const bb=(Number.isFinite(step.maneuver.bearing_before)? (step.maneuver.bearing_before+180)%360 : null);

  if(Number.isFinite(ba)){
    branches+=branchPts(ba, 60, 7, "#2f9bff", 0.95, true);
  }
  const ints=step.intersections && step.intersections[0];
  if(ints && ints.bearings){
    ints.bearings.forEach((b,i)=>{
      if(ints.entry && ints.entry[i]===false) return;
      if(bb!=null && Math.abs(((b-bb+540)%360)-180)<70) return;
      if(Number.isFinite(ba) && Math.abs(((b-ba+540)%360)-180)<25) return;
      branches+=branchPts(b, 48, 5.5, "#39414e", 0.55, true);
    });
  }

  roadSvg.innerHTML=
    `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">`+
      `<stop offset="0" stop-color="#5f83b0"/><stop offset="1" stop-color="#2b3c60"/></linearGradient>`+
      `<linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1">`+
      `<stop offset="0" stop-color="#0c1118"/><stop offset="1" stop-color="#05070a"/></linearGradient></defs>`+
    `<rect x="0" y="0" width="${W}" height="${horizonY.toFixed(1)}" fill="url(#sky)"/>`+
    `<rect x="0" y="${horizonY.toFixed(1)}" width="${W}" height="${groundH.toFixed(1)}" fill="url(#gnd)"/>`+
    `<polygon points="${roadPts}" fill="#262c36" stroke="#0d1014" stroke-width="1"/>`+
    `<polygon points="${hiPts}" fill="#2f9bff" opacity="0.9"/>`+
    branches+
    `<path d="${cl}" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 12" stroke-linecap="round"/>`+
    `<circle cx="${(W/2).toFixed(1)}" cy="${(H-W*0.05).toFixed(1)}" r="${Math.max(8,W*0.04).toFixed(1)}" fill="#fff" stroke="#2f9bff" stroke-width="${Math.max(3,W*0.012).toFixed(1)}"/>`;
}

function updateNavigation(){
  if(!routeActive || !lastPos || !routeSteps.length || !routeCoords.length) return;
  const proj=projectOnRoute(lastPos.lat, lastPos.lon);
  const userS=proj.s, totalDist=proj.total;

  if(proj.off>0.0004){ scheduleReroute(); return; }

  if(!maneuverS || maneuverS.length!==routeSteps.length){
    maneuverS=routeSteps.map(s=>{
      const m=s.maneuver.location;
      const r=projRouteIndex(m[1], m[0]);
      return proj.cum[r.i]+r.t*(proj.cum[r.i+1]-proj.cum[r.i]);
    });
  }

  let next=maneuverS.findIndex(s=>s>userS+1);
  if(next===-1) next=maneuverS.length-1;
  const distToTurn=Math.max(0,maneuverS[next]-userS);
  const remainDist=Math.max(0,totalDist-userS);
  const remainTime=totalDist>0 ? remainDist/(totalDist/routeDuration) : 0;

  if(activeSegLine) activeSegLine.setLatLngs(sliceRoute(proj, maneuverS[next]));
  updateNavBar(routeSteps[next], distToTurn, remainTime, remainDist);
  rvEta.textContent=`ETA ${formatETA(remainTime)} • ${formatDistance(remainDist)} left`;
  checkTTS(next, distToTurn, routeSteps[next], lastSpeed);
  renderRoadPreview(proj, userS, distToTurn, totalDist, next);

  if(remainDist<15){
    if(!arrived){
      arrived=true;
      remainDistArrived=true;
      navText.textContent="Arrived 🎉";
      navSub.textContent="";
      rvEta.textContent="Arrived 🎉";
      speak("You have arrived at your destination");
      setTimeout(()=>{
        if(routeActive){
          stopRoute();
          toast("Arrived at destination");
        }
      },4000);
    }
    return;
  }
}

async function scheduleReroute(){
  if(rerouting || !routeActive) return;
  const now=Date.now();
  if(now-(scheduleReroute._last||0)<8000) return;
  scheduleReroute._last=now;
  rerouting=true;
  navText.textContent="Rerouting…";
  navSub.textContent="";
  speak("Rerouting");
  try{
    await startRoute(false, true);
  }finally{
    rerouting=false;
  }
}

/* ================= wake lock ================= */
let wl=null;
async function requestWakeLock(){
  if(wl || typeof navigator.wakeLock==="undefined") return;
  try{
    const l=await navigator.wakeLock.request("screen");
    wl=l;
    l.addEventListener("release",()=>{ if(wl===l) wl=null; });
  }catch(e){ wl=null; }
}
function keepScreenOn(){
  requestWakeLock();
  setTimeout(keepScreenOn, 45000);
}
keepScreenOn();
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") requestWakeLock();
});
["touchstart","pointerdown"].forEach(ev=>document.addEventListener(ev,()=>requestWakeLock(),{passive:true}));
</script>
